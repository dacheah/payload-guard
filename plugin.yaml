name: payload-guard
version: 1.1.0
description: >-
  Pre-flight the outgoing request against the empirically measured provider payload
  ceilings published in github.com/dacheah/payload-walls: body bytes, total image
  bytes, per-item bytes and item count, plus the input-token budget. Warn-only: it measures the real outgoing
  request and logs what it finds; it never rewrites the payload.
author: Dan Cheah, Hermes Agent
kind: standalone
requires_hermes: ">=0.21.0"
platforms:
  - linux
tags:
  - limits
  - payload
  - observability
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
provides_commands:
  - payload-guard
optional_env:
  - HERMES_PAYLOAD_GUARD_STATE
  - PAYLOAD_WALLS_JSON
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
